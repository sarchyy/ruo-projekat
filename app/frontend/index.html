<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brojač posjeta</title>
<style>
  :root { --bg:#f4f6fb; --card:#ffffff; --ink:#1b2437; --muted:#5b6578; --line:#dfe4ee; --accent:#3b5bdb; --ok:#2f9e44; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151d; --card:#1b2030; --ink:#eef1f8; --muted:#9aa4b8; --line:#2a3145; --accent:#8da2fb; --ok:#51cf66; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:560px; }
  .kartica { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 28px; text-align:center; box-shadow:0 6px 24px rgba(20,30,60,.08); }
  h1 { margin:0; font-size:1rem; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .broj { font-size:clamp(3.5rem,18vw,6rem); font-weight:700; line-height:1.1; margin:14px 0 6px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .opis { margin:0; color:var(--muted); }
  button { margin-top:22px; padding:10px 22px; border-radius:999px; border:1px solid var(--accent); background:transparent; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--accent); color:var(--card); }
  button:disabled { opacity:.6; cursor:wait; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .poruka { min-height:1.4em; margin:12px 0 0; color:var(--muted); font-size:.9rem; }
  .slojevi { margin-top:16px; display:grid; gap:10px; grid-template-columns:1fr; }
  @media (min-width:560px) { .slojevi { grid-template-columns:repeat(3,1fr); } }
  .sloj { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:.9rem; }
  .sloj b { display:flex; align-items:center; gap:8px; }
  .sloj small { display:block; margin-top:4px; color:var(--muted); }
  .tacka { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .slojevi.ok .tacka { background:var(--ok); }
</style>
</head>
<body>
<main>
  <section class="kartica" aria-live="polite">
    <h1>Broj posjeta</h1>
    <div class="broj" id="broj">…</div>
    <p class="opis" id="opis">Učitavam iz baze…</p>
    <button id="dugme" type="button">Pozovi ponovo</button>
    <p class="poruka" id="poruka" role="status"></p>
  </section>
  <div class="slojevi" id="slojevi">
    <div class="sloj"><b><span class="tacka"></span>Frontend</b><small>Nginx · mreže web i app</small></div>
    <div class="sloj"><b><span class="tacka"></span>Backend</b><small>Flask · mreže app i db</small></div>
    <div class="sloj"><b><span class="tacka"></span>Baza</b><small>PostgreSQL · mreža db</small></div>
  </div>
</main>
<script>
(function () {
  var broj = document.getElementById('broj');
  var opis = document.getElementById('opis');
  var poruka = document.getElementById('poruka');
  var dugme = document.getElementById('dugme');
  var slojevi = document.getElementById('slojevi');

  function ucitaj() {
    dugme.disabled = true;
    poruka.textContent = '';
    fetch('/api/posjete', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        broj.textContent = Number(d.posjete).toLocaleString('bs-BA');
        opis.textContent = 'Zahtjev je prošao kroz sva tri sloja i upisan je u bazu.';
        slojevi.className = 'slojevi ok';
      })
      .catch(function (e) {
        broj.textContent = '–';
        opis.textContent = 'Aplikacija trenutno ne odgovara.';
        poruka.textContent = 'Greška: ' + e.message;
        slojevi.className = 'slojevi';
      })
      .then(function () { dugme.disabled = false; });
  }

  dugme.addEventListener('click', ucitaj);
  ucitaj();
})();
</script>
</body>
</html>
