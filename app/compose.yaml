name: ruo

services:
  frontend:
    build: ./frontend
    image: ruo/frontend:1.0
    ports:
      - "80:80"                         # jedini port objavljen izvana
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [web, app]

  backend:
    build: ./backend
    image: ruo/backend:1.0
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [app, db]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data  # podaci prežive brisanje kontejnera (AO-10)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [db]                      # nema "ports:": baza nema objavljen port (AO-6)

volumes:
  dbdata:

networks:
  web:
    ipam:
      config:
        - subnet: 10.40.1.0/24
  app:
    internal: true
    ipam:
      config:
        - subnet: 10.40.2.0/24
  db:
    internal: true
    ipam:
      config:
        - subnet: 10.40.3.0/24
