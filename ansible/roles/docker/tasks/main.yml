- name: Docker i Compose su instalirani
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker servis radi i pokreće se pri paljenju
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: korisnik student smije koristiti Docker
  ansible.builtin.user:
    name: student
    groups: docker
    append: true
