- name: direktorij aplikacije postoji
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0750"

- name: kod aplikacije je kopiran na VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_dir }}/"
    mode: preserve

- name: .env s tajnama (samo root može čitati)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    mode: "0600"
  no_log: true               # vrijednost se ne ispisuje u izlazu

- name: aplikacija je izgrađena i pokrenuta
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
