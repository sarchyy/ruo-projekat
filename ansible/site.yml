- name: Priprema svih mašina
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: čekaj da SSH postane dostupan
      ansible.builtin.wait_for_connection: { timeout: 300 }
    - name: čekaj da cloud-init završi
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
    - name: prikupi činjenice o mašini
      ansible.builtin.setup:

- name: Aplikacijska VM
  hosts: app_servers
  become: true
  roles:
    - docker
